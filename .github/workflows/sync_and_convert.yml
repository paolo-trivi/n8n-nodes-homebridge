name: Drive to GitHub Sync

on:
  schedule:
    # Ogni giorno alle 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_convert:
        description: "Force reconversion of all files (ignore cache)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

env:
  RAW_DIR: raw_data
  DOCS_DIR: docs
  RCLONE_REMOTE_NAME: gdrive
  DRIVE_PATH: ${{ vars.DRIVE_PATH || 'Shared drives/TeamDocs' }}

jobs:
  sync-and-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # 2. Validate configuration
      # ------------------------------------------------------------------
      - name: Validate secrets
        env:
          RCLONE_SA_JSON: ${{ secrets.RCLONE_SA_JSON }}
          TEAM_DRIVE_ID: ${{ secrets.TEAM_DRIVE_ID }}
        run: |
          if [ -z "${RCLONE_SA_JSON}" ]; then
            echo "::error::Secret RCLONE_SA_JSON is not set. Configure it in Settings > Secrets."
            exit 1
          fi
          if [ -z "${TEAM_DRIVE_ID}" ]; then
            echo "::error::Secret TEAM_DRIVE_ID is not set. Configure it in Settings > Secrets."
            exit 1
          fi
          echo "Secrets validated."

      # ------------------------------------------------------------------
      # 3. Install system dependencies
      # ------------------------------------------------------------------
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc poppler-utils

      # ------------------------------------------------------------------
      # 4. Install rclone
      # ------------------------------------------------------------------
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      # ------------------------------------------------------------------
      # 5. Configure rclone with Service Account
      # ------------------------------------------------------------------
      - name: Configure rclone
        env:
          RCLONE_SA_JSON: ${{ secrets.RCLONE_SA_JSON }}
          TEAM_DRIVE_ID: ${{ secrets.TEAM_DRIVE_ID }}
        run: |
          mkdir -p ~/.config/rclone

          echo "${RCLONE_SA_JSON}" > /tmp/sa.json
          chmod 600 /tmp/sa.json

          # Validate JSON syntax
          python3 -c "import json, sys; json.load(open('/tmp/sa.json'))" || {
            echo "::error::RCLONE_SA_JSON is not valid JSON."
            exit 1
          }

          {
            echo "[${RCLONE_REMOTE_NAME}]"
            echo "type = drive"
            echo "scope = drive.readonly"
            echo "service_account_file = /tmp/sa.json"
            echo "team_drive = ${TEAM_DRIVE_ID}"
          } > ~/.config/rclone/rclone.conf

          echo "Rclone configured."

      # ------------------------------------------------------------------
      # 6. Sync files from Drive
      # ------------------------------------------------------------------
      - name: Sync from Google Drive
        run: |
          mkdir -p "${RAW_DIR}"

          echo "Syncing from: ${RCLONE_REMOTE_NAME}:${DRIVE_PATH}"
          rclone copy \
            "${RCLONE_REMOTE_NAME}:${DRIVE_PATH}" \
            "${RAW_DIR}/" \
            --drive-acknowledge-abuse \
            --drive-export-formats docx,xlsx,pptx,csv \
            --transfers 8 \
            --checkers 16 \
            --retries 3 \
            --low-level-retries 10 \
            --stats-one-line \
            --stats 5s \
            -v

          echo ""
          echo "=== Files synced ==="
          find "${RAW_DIR}" -type f | head -100
          FILE_COUNT=$(find "${RAW_DIR}" -type f | wc -l)
          echo "Total: ${FILE_COUNT} files"

          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "::warning::No files synced from Drive. Check DRIVE_PATH and permissions."
          fi

      # ------------------------------------------------------------------
      # 7. Setup Python
      # ------------------------------------------------------------------
      # Note: deleted files are handled by convert.py's manifest-based
      # stale removal. Since raw_data/ starts empty each workflow run
      # (gitignored), there are no leftover local files to detect.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 8. Convert files
      # ------------------------------------------------------------------
      - name: Convert to Markdown
        env:
          FORCE_CONVERT: ${{ inputs.force_convert }}
        run: |
          FORCE_FLAG=""
          if [ "${FORCE_CONVERT}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          python scripts/convert.py \
            --raw-dir "${RAW_DIR}" \
            --docs-dir "${DOCS_DIR}" \
            ${FORCE_FLAG} \
            -v

      # ------------------------------------------------------------------
      # 9. Generate index
      # ------------------------------------------------------------------
      - name: Generate docs index
        run: python scripts/generate_index.py --docs-dir "${DOCS_DIR}"

      # ------------------------------------------------------------------
      # 10. Cleanup secrets
      # ------------------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/sa.json
          rm -f ~/.config/rclone/rclone.conf

      # ------------------------------------------------------------------
      # 11. Commit and push
      # ------------------------------------------------------------------
      - name: Commit and push changes
        run: |
          git config user.name "drive-sync-bot"
          git config user.email "drive-sync-bot@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            FILE_COUNT=$(find docs/ -name '*.md' -not -name 'INDEX.md' | wc -l)
            git commit -m "docs: sync from Google Drive (${TIMESTAMP})" \
              -m "Auto-generated from shared drive. Markdown files: ${FILE_COUNT}"
            git push
          fi
